[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgera"
version = "0.1.0"
description = "Dual-approach banking + projections + line-by-line accounting"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Ledgera Team" }]
dependencies = [
    # Core data and financial analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.32",

    # Database and ORM
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",

    # API and web framework
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Data validation and processing
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",

    # CSV and file handling
    "openpyxl>=3.1.0",

    # Security and encryption
    "cryptography>=41.0.0",

    # Authentication
    "passlib[argon2]>=1.7.4",
    "PyJWT>=2.8.0",
    "argon2-cffi>=23.1.0",
    "google-auth>=2.0.0",
    "requests>=2.31.0",
    "firebase-admin>=6.0.0",

    # File uploads (FastAPI multipart)
    "python-multipart>=0.0.6",

    # Email (Resend)
    "resend>=0.7.0",

    # Rate limiting (in-memory backend; Redis recommended for production)
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.6.0",
    "mypy>=1.6.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipython>=8.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".conda", ".venv", "build", "dist", "frontend"]

[tool.ruff.lint]
# Baseline modern ruleset; extend later once codebase is clean.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez (block naive datetime.utcnow/now())
    "BLE",   # flake8-blind-except (require narrowed except; see B25)
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # allow function calls in FastAPI Depends() defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
